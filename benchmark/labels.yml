  INC-C12:
    scenario: legacy_duplicate_patient
    split: known
    category: integrity.duplicate_records
    source: synthetic_fhir_bundle
    columns: [Patient.id, patients.id, pat-003]
    impact: previous_version_served
    actions: [correct_source_records, request_corrected_delivery]
    note: The alert is identical to INC-C05's ("Patient/pat-003 invalid gender code"), but the record with
      code 'F' is a second copy of pat-003 appended from a legacy system. Fixing the code would only move
      the failure to the duplicate-id check.
  INC-C13:
    scenario: orphan_condition_without_task_log
    split: known
    category: referential.orphan_reference
    source: synthetic_fhir_bundle
    columns: [encounter.reference, encounter_id]
    impact: previous_version_served
    actions: [correct_source_records, request_corrected_delivery]
    note: The quality gate failed, but its log cannot be served (a 404 from the worker's log server) and no
      exception text was kept. The bundle profile shows the cause, a Condition that references
      Encounter/enc-007, which does not exist. The log server's 404 is not the source being unavailable.
  INC-C14:
    scenario: versioned_references
    split: known
    category: values.type_format_drift
    source: synthetic_fhir_bundle
    columns: [subject.reference, encounter.reference, patient_id, encounter_id]
    impact: previous_version_served
    actions: [update_transformation, amend_data_contract]
    note: Same error as an orphan reference ("Encounter/enc-001 missing patient"), but every referenced
      resource exists. The upstream switched to version-specific references (Patient/pat-001/_history/2),
      which are valid FHIR; the parser has to handle them, and nothing in the source needs correcting.
