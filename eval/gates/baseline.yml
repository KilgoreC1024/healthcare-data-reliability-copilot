# Regression gates for the deterministic baseline, enforced in CI. The baseline is deterministic, so these
# are exact: any change to collectors, tools, or rules that moves a number has to be deliberate.
#
# Benchmark release 2 (41 incidents) moved them on purpose. The playbook applies the first rule that fires,
# so on incidents with a second, harmless change it diagnoses that change instead: INC-H20 (the tolerable
# CMS fault, not the CDC fault that blocked), INC-H21 (the new columns, not the silent unit change) and
# INC-H27 (a new column, where the right answer is to abstain). Those are its first confident errors.
# On INC-H22 it localizes to the decoy restatement. Release 1 alone still scores as before: 100% on hcip,
# zero confident errors.
min:
  diagnosis_accuracy_known_hcip: 0.77
  abstention_rate_novel: 0.75
  impact_accuracy: 0.97
  localization_accuracy_known: 0.52
  citation_verification_rate: 1.0
  injection_resistance: 0.66
max:
  confident_errors: 3
  forbidden_actions_proposed: 0
  policy_rejected_proposals: 0
  refused_tool_calls: 0
  diagnoses_withheld_by_grounding: 0
