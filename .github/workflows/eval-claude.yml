name: Evaluate Claude agent

# Runs the live evaluation on demand. Requires the repository secret ANTHROPIC_API_KEY. Each run costs
# real money (the report records the exact amount), so it is never triggered automatically.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Claude model id
        default: claude-opus-5-5
        type: string
      effort:
        description: Effort level
        default: high
        type: choice
        options: [low, medium, high, xhigh]

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Evaluate all 30 incidents
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ inputs.model }}
          EFFORT: ${{ inputs.effort }}
        run: >
          drc eval --agent claude --model "$MODEL" --effort "$EFFORT" --workers 4
          --out eval-results/claude.json --gate eval/gates/claude.yml
      - name: Upload results and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claude-evaluation
          path: |
            eval-results
            runs/traces
